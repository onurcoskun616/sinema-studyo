name: assemble
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Kurgu işi kimliği
        required: true
      api_base:
        description: Uygulama adresi
        required: true
      token:
        description: Tek kullanımlık iş jetonu
        required: true
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Jetonu gizle
        env:
          JOB_TOKEN: ${{ inputs.token }}
        run: echo "::add-mask::$JOB_TOKEN"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg ve yazı tipleri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation > /dev/null
          ffmpeg -version | head -1
      - name: Kurgu
        env:
          JOB_ID: ${{ inputs.job_id }}
          API_BASE: ${{ inputs.api_base }}
          JOB_TOKEN: ${{ inputs.token }}
        run: node worker/assemble.mjs
